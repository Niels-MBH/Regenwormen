<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐛 Regenwormen - Gaze Control</title>

<!-- WebGazer: oogbesturing via webcam -->
<script src="https://cdn.jsdelivr.net/npm/webgazer@2.0.1/dist/webgazer.min.js"></script>

<style>
@font-face { font-family:'Fredoka One'; font-weight:400; font-display:swap;
  src:url(https://fonts.gstatic.com/s/fredokaone/v15/k3kUo8kEI-tA1RRcTZGmTlHGCac.woff2) format('woff2'); }
@font-face { font-family:'Nunito'; font-weight:400; font-display:swap;
  src:url(https://fonts.gstatic.com/s/nunito/v32/XRXV3I6Li01BKofINeaB.woff2) format('woff2'); }
@font-face { font-family:'Nunito'; font-weight:700; font-display:swap;
  src:url(https://fonts.gstatic.com/s/nunito/v32/XRXV3I6Li01BKofIO-aBXso.woff2) format('woff2'); }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;
  background:#2a5c38;min-height:100vh;color:#2c1810;
  background-image:
    radial-gradient(ellipse at top left,rgba(255,255,255,.06) 0%,transparent 55%),
    radial-gradient(ellipse at bottom right,rgba(0,0,0,.18) 0%,transparent 55%);
  overflow-x: hidden;
}

.screen{display:none}.screen.active{display:block}

/* Gaze Cursor */
#gazeCursor {
  position: fixed;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(52,152,219,.3);
  border: 3px solid #3498db;
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%, -50%);
  display: none;
  transition: background .15s;
}
#gazeCursor.dwelling { background: rgba(46,204,113,.5); border-color: #2ecc71; }

/* WebGazer Video */
#webgazerVideoContainer {
  position: fixed !important;
  top: 10px !important; left: 10px !important;
  width: 120px !important; height: 90px !important;
  border-radius: 8px !important; border: 2px solid #fff !important;
  z-index: 9998 !important;
}

/* Kalibratie */
#calOverlay { position: fixed; inset: 0; background: #1a3a24; z-index: 10000; display: none; }
#calOverlay.show { display: block; }
.cal-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; }
.cal-dot { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: #f5b731; border: 3px solid #fff; transform: translate(-50%, -50%); cursor: pointer; display: flex; align-items:center; justify-content:center; font-family:'Fredoka One'; }
.cal-dot.done { background:#2ecc71; }

/* UI Elements */
#setup{max-width:560px;margin:0 auto;padding:2rem 1rem;text-align:center}
.logo{font-family:'Fredoka One',sans-serif;font-size:3.5rem;color:#f5b731;text-shadow:3px 4px 0 #c8901a;margin-bottom:1rem}
.card{background:#fdf6e3;border-radius:24px;padding:1.75rem;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.count-row{display:flex;gap:8px;justify-content:center;margin-bottom:1.4rem}
.count-btn{width:50px;height:50px;border-radius:50%;border:2px solid #ddd;cursor:pointer;font-family:'Fredoka One';}
.count-btn.active{background:#2ecc71;color:white;border-color:#1a9e52}
.name-inputs{display:grid;gap:8px;margin-bottom:1.4rem}
.name-input{width:100%;padding:10px;border-radius:10px;border:2px solid #e0d8c8;font-weight:700}
.big-btn{width:100%;padding:18px;border-radius:18px;border:none;font-family:'Fredoka One';font-size:1.3rem;cursor:pointer;position:relative;overflow:hidden}
.btn-green{background:#2ecc71;color:#fff;box-shadow:0 4px 0 #1a9e52}
.btn-blue {background:#3498db;color:#fff;box-shadow:0 4px 0 #1a6ea8}
.btn-orange{background:#e67e22;color:#fff;box-shadow:0 4px 0 #b85a12}
.dwell-ring{position:absolute;inset:0;pointer-events:none;}

/* Game Styles */
#game{max-width:900px;margin:0 auto;padding:1rem;display:flex;flex-direction:column;gap:1rem}
.g-header{background:rgba(0,0,0,.3);padding:1rem;border-radius:15px;display:flex;justify-content:space-between;color:white}
.tile-row{display:flex;flex-wrap:wrap;gap:5px;min-height:70px}
.tile{width:50px;height:70px;background:#f5b731;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 3px 0 #c8901a}
.dice-card{background:#fdf6e3;padding:1.5rem;border-radius:20px}
.dice-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:1rem 0}
.die{width:80px;height:80px;background:white;border:3px solid #ddd;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-family:'Fredoka One';cursor:pointer}
.die.used{opacity:0.3}
.chosen-area{min-height:70px;background:rgba(46,204,113,.1);border:2px dashed #2ecc71;border-radius:15px;display:flex;gap:5px;padding:10px}
.c-die{width:50px;height:50px;background:#d4f5e3;border:2px solid #2ecc71;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One'}
.players-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.p-card{background:rgba(0,0,0,.2);padding:10px;border-radius:15px;color:white}
.p-card.cur{border:3px solid #f5b731}

/* Overlays */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:2000}
#overlay.show{display:flex}
.msg-box{background:white;padding:2rem;border-radius:20px;text-align:center;max-width:300px}
</style>
</head>
<body>

<div id="gazeCursor"></div>

<div id="calOverlay">
  <div class="cal-info"><h2>📷 Kijk en klik</h2><p>Klik op de 9 gele stippen om te kalibreren.</p><div id="calProgress">0/9</div></div>
</div>

<div id="setup" class="screen active">
  <div class="logo">Regenwormen</div>
  <div class="card">
    <div class="count-row" id="countRow"></div>
    <div class="name-inputs" id="nameInputs"></div>
    <button class="big-btn btn-green" id="btnStart" onclick="startGame()">🐛 Start Spel<div class="dwell-ring"></div></button>
  </div>
  <div style="margin-top:20px; color:white;">
    <input type="checkbox" id="webcamToggle" checked> Gebruik Webcam Oogbesturing
  </div>
</div>

<div id="game" class="screen">
  <div class="g-header">
    <div><small>Speler:</small><div id="hName" style="font-size:1.5rem"></div></div>
    <div style="text-align:center"><div id="hScore" style="font-size:2rem; color:#f5b731">0</div><small>Totaal</small></div>
    <div id="hWorms">🐛 0</div>
  </div>
  <div class="tile-row" id="tileRow"></div>
  <div class="dice-card">
    <div id="instruction" style="text-align:center; margin-bottom:10px; font-weight:800">Gooi de stenen!</div>
    <div class="dice-row" id="diceRow"></div>
    <div class="chosen-area" id="chosenArea"></div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px">
      <button class="big-btn btn-blue" id="btnRoll" onclick="doRoll()">🎲 Gooi!<div class="dwell-ring"></div></button>
      <button class="big-btn btn-orange" id="btnStop" onclick="doStop()" disabled>🛑 Stop<div class="dwell-ring"></div></button>
    </div>
  </div>
  <div class="players-grid" id="playersGrid"></div>
</div>

<div id="overlay">
  <div class="msg-box">
    <h2 id="mTitle"></h2><p id="mText" style="margin:15px 0"></p>
    <button class="big-btn btn-green" id="mBtn" onclick="closeOverlay()">OK<div class="dwell-ring"></div></button>
  </div>
</div>

<script>
/* GAME LOGIC */
let players = [], currentPlayer = 0, tableTiles = [], dice = [], chosenDice = [], locked = [];
let dwellMode = true, dwellDuration = 1200, dwellTimers = new Map();
let webcamActive = false;

// Setup spelers
let numPlayers = 2;
const defNames = ['Anna','Boris','Carmen','David','Eva','Floris','Gina'];

function buildSetup() {
  const row = document.getElementById('countRow');
  for(let n=2; n<=7; n++){
    const b = document.createElement('button');
    b.className = 'count-btn' + (n===2?' active':'');
    b.textContent = n;
    b.onclick = () => {
      numPlayers = n;
      document.querySelectorAll('.count-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); buildNames();
    };
    row.appendChild(b);
  }
  buildNames();
}
buildSetup();

function buildNames() {
  const el = document.getElementById('nameInputs');
  el.innerHTML = '';
  for(let i=0; i<numPlayers; i++){
    const inp = document.createElement('input');
    inp.className = 'name-input'; inp.placeholder = defNames[i];
    el.appendChild(inp);
  }
}

function startGame() {
  players = [...document.querySelectorAll('.name-input')].map((inp,i)=>({
    name: inp.value.trim() || defNames[i], tiles: []
  }));
  tableTiles = Array.from({length:16}, (_,i)=>21+i);
  if(document.getElementById('webcamToggle').checked) {
    initWebGazer();
  } else {
    showScreen('game'); renderAll();
  }
}

function renderAll() {
  const tRow = document.getElementById('tileRow'); tRow.innerHTML = '';
  tableTiles.forEach(t => {
    const d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = `<div>${t}</div><div style="font-size:0.7rem">🐛${Math.floor((t-21)/4)+1}</div>`;
    tRow.appendChild(d);
  });

  const pGrid = document.getElementById('playersGrid'); pGrid.innerHTML = '';
  players.forEach((p, i) => {
    const c = document.createElement('div'); c.className = 'p-card' + (i===currentPlayer?' cur':'');
    const top = p.tiles.length ? p.tiles[p.tiles.length-1] : '--';
    c.innerHTML = `<div>${p.name}</div><div style="font-size:1.2rem; color:#f5b731">🐛 ${p.tiles.reduce((s,t)=>s+(Math.floor((t-21)/4)+1),0)}</div><small>Top: ${top}</small>`;
    pGrid.appendChild(c);
  });

  document.getElementById('hName').textContent = players[currentPlayer].name;
  document.getElementById('hScore').textContent = chosenDice.reduce((s,d)=>s+(d==='W'?5:d),0);
  renderDice();
}

function renderDice() {
  const dRow = document.getElementById('diceRow'); dRow.innerHTML = '';
  dice.forEach(v => {
    const d = document.createElement('div'); d.className = 'die';
    d.textContent = v === 'W' ? '🐛' : v;
    if(locked.includes(v)) d.classList.add('used');
    else {
      d.onclick = () => lockDice(v);
      applyDwell(d, () => lockDice(v));
    }
    d.innerHTML += '<div class="dwell-ring"></div>';
    dRow.appendChild(d);
  });

  const cArea = document.getElementById('chosenArea'); cArea.innerHTML = '';
  chosenDice.forEach(v => {
    const d = document.createElement('div'); d.className = 'c-die';
    d.textContent = v === 'W' ? '🐛' : v;
    cArea.appendChild(d);
  });

  document.getElementById('btnRoll').disabled = dice.length > 0;
  document.getElementById('btnStop').disabled = !(dice.length === 0 && locked.includes('W'));
}

function doRoll() {
  const rem = 8 - chosenDice.length;
  dice = Array.from({length:rem}, () => {
    const r = Math.floor(Math.random()*6)+1; return r===6?'W':r;
  });
  if(!dice.some(v => !locked.includes(v))) {
    showOverlay('Mislukt!', 'Geen nieuwe stenen mogelijk!', fail);
  }
  renderDice();
}

function lockDice(v) {
  locked.push(v);
  chosenDice.push(...dice.filter(d => d === v));
  dice = []; renderAll();
}

function doStop() {
  const score = chosenDice.reduce((s,d)=>s+(d==='W'?5:d),0);
  let taken = false;
  
  // Steel van speler
  for(let i=0; i<players.length; i++) {
    if(i === currentPlayer) continue;
    if(players[i].tiles.length && players[i].tiles[players[i].tiles.length-1] === score) {
      players[currentPlayer].tiles.push(players[i].tiles.pop());
      taken = true; showOverlay('Gestolen!', 'Je steelt een tegel!', nextTurn);
      break;
    }
  }

  if(!taken) {
    const possible = tableTiles.filter(t => t <= score);
    if(possible.length) {
      const best = Math.max(...possible);
      tableTiles = tableTiles.filter(t => t !== best);
      players[currentPlayer].tiles.push(best);
      showOverlay('Punten!', `Je pakt tegel ${best}`, nextTurn);
    } else {
      showOverlay('Helaas!', 'Geen passende tegel gevonden.', fail);
    }
  }
}

function fail() {
  if(players[currentPlayer].tiles.length) {
    tableTiles.push(players[currentPlayer].tiles.pop());
    tableTiles.sort((a,b)=>a-b);
  }
  tableTiles.pop(); // Verwijder hoogste
  nextTurn();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % players.length;
  dice = []; chosenDice = []; locked = [];
  renderAll();
}

/* DWELL & GAZE SYSTEM */
function applyDwell(el, cb) {
  el.onmouseenter = () => {
    const ring = el.querySelector('.dwell-ring');
    const start = Date.now();
    const id = setInterval(() => {
      const p = Math.min((Date.now()-start)/dwellDuration, 1);
      if(ring) ring.style.background = `conic-gradient(#2ecc71 ${p*360}deg, transparent 0deg)`;
      if(p >= 1) { clearInterval(id); ring.style.background=''; cb(); }
    }, 20);
    dwellTimers.set(el, id);
  };
  el.onmouseleave = () => {
    clearInterval(dwellTimers.get(el));
    if(el.querySelector('.dwell-ring')) el.querySelector('.dwell-ring').style.background='';
  };
}

function initWebGazer() {
  webgazer.setGazeListener((data) => {
    if(!data) return;
    const x = data.x, y = data.y;
    const cursor = document.getElementById('gazeCursor');
    cursor.style.left = x + 'px'; cursor.style.top = y + 'px';
    
    const target = document.elementFromPoint(x, y);
    handleGazeHover(target);
  }).begin();
  
  document.getElementById('gazeCursor').style.display = 'block';
  startCalibration();
}

let lastTarget = null;
function handleGazeHover(target) {
  if(target === lastTarget) return;
  if(lastTarget) lastTarget.dispatchEvent(new MouseEvent('mouseleave'));
  if(target) target.dispatchEvent(new MouseEvent('mouseenter'));
  lastTarget = target;
}

function startCalibration() {
  const overlay = document.getElementById('calOverlay');
  overlay.classList.add('show');
  let dots = 0;
  const positions = [[10,10],[50,10],[90,10],[10,50],[50,50],[90,50],[10,90],[50,90],[90,90]];
  positions.forEach(pos => {
    const d = document.createElement('div'); d.className = 'cal-dot';
    d.style.left = pos[0]+'%'; d.style.top = pos[1]+'%';
    d.onclick = () => {
      d.classList.add('done'); dots++;
      document.getElementById('calProgress').textContent = dots+'/9';
      if(dots===9) { overlay.classList.remove('show'); showScreen('game'); renderAll(); }
    };
    overlay.appendChild(d);
  });
}

/* OVERLAY HELPERS */
function showOverlay(t, txt, cb) {
  document.getElementById('mTitle').textContent = t;
  document.getElementById('mText').textContent = txt;
  document.getElementById('overlay').classList.add('show');
  window.overlayCB = cb;
}
function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  if(window.overlayCB) window.overlayCB();
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Init static buttons
['btnStart','btnRoll','btnStop','mBtn'].forEach(id => {
  const el = document.getElementById(id);
  if(el) applyDwell(el, () => el.click());
});
</script>
</body>
</html>
